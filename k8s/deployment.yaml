apiVersion: apps/v1
kind: Deployment
metadata:
  name: gmz-health-app
  labels:
    app: gmz-health-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gmz-health-app
  template:
    metadata:
      labels:
        app: gmz-health-app
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: health-app-container
          image: DOCKER_IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "32Mi"
              cpu: "20m"
            limits:
              memory: "128Mi"
              cpu: "150m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
