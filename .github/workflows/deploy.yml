name: Build, Push to Docker Hub and Deploy to Kubernetes

on:
  push:
    branches: [ "main" ]

jobs:
  # ==========================================
  # JOB 1: Docker Image Build & Push to Docker Hub
  # ==========================================
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/gmz-health-app:latest

  # ==========================================
  # JOB 2: Deploy to Kubernetes on AWS EC2
  # ==========================================
  deploy-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Kubernetes Cluster via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # 1. 2GB Swap Memory ensure karein (1GB RAM freeze se bachane ke liye)
            if [ ! -f /swapfile ]; then
              echo "Creating 2GB swap space..."
              sudo dd if=/dev/zero of=/swapfile bs=128M count=16
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile swap swap defaults 0 0' | sudo tee -a /etc/fstab
            fi
            sudo swapon /swapfile 2>/dev/null || true

            # 2. Standalone Docker container stop karein (port 3000 free karne ke liye)
            sudo docker stop gmz-health-app 2>/dev/null || true
            sudo docker rm gmz-health-app 2>/dev/null || true

            # 3. K3s install check (Agar installed nahi hai to install karein)
            if ! command -v k3s &> /dev/null; then
              echo "Installing lightweight K3s..."
              curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable=traefik --disable=servicelb" sh -
            fi

            # Sirf tab start karein agar K3s inactive ho (har dafa restart karne se cluster freeze hota hai)
            if ! sudo systemctl is-active --quiet k3s; then
              sudo systemctl start k3s
            fi

            sudo chmod 644 /etc/rancher/k3s/k3s.yaml 2>/dev/null || true
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            # 4. K3s API Server ke 100% ready hone ka intezar karein
            echo "Waiting for Kubernetes API Server (/readyz)..."
            for i in {1..30}; do
              if sudo kubectl get --raw /readyz &>/dev/null; then
                echo "Kubernetes API Server is Ready!"
                break
              fi
              sleep 2
            done

            # 5. Clean Git Pull
            sudo mkdir -p /var/www/html
            sudo chown -R $USER:$USER /var/www/html
            cd /var/www/html
            if [ ! -d "/var/www/html/GMZ_Task_2/.git" ]; then
              git clone https://github.com/ZainCloud009/GMZ_Task_2.git
            else
              cd /var/www/html/GMZ_Task_2
              git reset --hard HEAD
              git pull origin main
            fi

            cd /var/www/html/GMZ_Task_2

            # 6. Docker Hub credentials ka secret banayein
            sudo kubectl create secret docker-registry dockerhub-secret \
              --docker-server=https://index.docker.io/v1/ \
              --docker-username="${{ secrets.DOCKER_USERNAME }}" \
              --docker-password="${{ secrets.DOCKER_PASSWORD }}" \
              --dry-run=client -o yaml | sudo kubectl apply -f -

            # 7. deployment.yaml me Docker Hub image name set karein
            sed -i "s|DOCKER_IMAGE_PLACEHOLDER|${{ secrets.DOCKER_USERNAME }}/gmz-health-app:latest|g" k8s/deployment.yaml

            # 8. Kubernetes apply without validation timeout (--validate=false)
            sudo kubectl apply --validate=false -f k8s/

            # 9. Rolling update & status check
            sudo kubectl rollout restart deployment/gmz-health-app
            if ! sudo kubectl rollout status deployment/gmz-health-app --timeout=120s; then
              echo "=== Pods Status ==="
              sudo kubectl get pods -o wide
              sudo kubectl describe pods
              exit 1
            fi
