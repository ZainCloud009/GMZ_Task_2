name: Build, Push to Docker Hub and Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  # ==========================================
  # JOB 1: Docker Image Build & Push to Docker Hub
  # ==========================================
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/gmz-health-app:latest

  # ==========================================
  # JOB 2: Server Par Pull aur Container Run
  # ==========================================
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Pull Image from Docker Hub and Run Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # 1. Docker check aur start karein (Amazon Linux 2023)
            if ! command -v docker &> /dev/null; then
              if command -v dnf &> /dev/null; then
                sudo dnf install -y docker
              else
                sudo apt-get update -y && sudo apt-get install -y docker.io
              fi
              sudo systemctl start docker
              sudo systemctl enable docker
            fi
            sudo systemctl start docker

            # 2. Port 3000 free karein (agar PM2 chal raha ho)
            command -v pm2 &> /dev/null && pm2 delete health-app 2>/dev/null || true

            # 3. Docker Hub se latest image pull karein
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/gmz-health-app:latest

            # 4. Purana container stop aur remove karein
            sudo docker stop gmz-health-app 2>/dev/null || true
            sudo docker rm gmz-health-app 2>/dev/null || true

            # 5. Docker Hub wali naye image se container run karein
            sudo docker run -d \
              --name gmz-health-app \
              --restart always \
              -p 3000:3000 \
              ${{ secrets.DOCKER_USERNAME }}/gmz-health-app:latest

            # 6. Purani bekaar images delete karein
            sudo docker image prune -f
