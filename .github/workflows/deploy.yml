name: Deploy to Server

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Repo to /var/www/html/GMZ_Task_2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # 1. Package manager detect karein (Amazon Linux 2023 uses dnf)
            if command -v dnf &> /dev/null; then
              PKG_INSTALL="sudo dnf install -y"
            else
              PKG_INSTALL="sudo apt-get install -y"
            fi

            # 2. Git, Node.js aur PM2 install karein agar nahi hain
            if ! command -v git &> /dev/null; then
              $PKG_INSTALL git
            fi

            if ! command -v node &> /dev/null; then
              $PKG_INSTALL nodejs
            fi

            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi

            # 3. Directory aur permissions
            sudo mkdir -p /var/www/html
            sudo chown -R $USER:$USER /var/www/html

            # 4. Clone ya Pull
            cd /var/www/html
            if [ ! -d "/var/www/html/GMZ_Task_2/.git" ]; then
              git clone https://github.com/ZainCloud009/GMZ_Task_2.git
            else
              cd /var/www/html/GMZ_Task_2
              git pull origin main
            fi

            # 5. Dependencies install aur PM2 restart
            cd /var/www/html/GMZ_Task_2
            npm install --omit=dev
            pm2 restart health-app 2>/dev/null || pm2 start server.js --name health-app
            pm2 save
