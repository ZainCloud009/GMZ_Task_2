name: Build, Push to Docker Hub and Deploy to Kubernetes

on:
  push:
    branches: [ "main" ]

jobs:
  # ==========================================
  # JOB 1: Docker Image Build & Push to Docker Hub
  # ==========================================
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/gmz-health-app:latest

  # ==========================================
  # JOB 2: Deploy to Kubernetes on AWS EC2
  # ==========================================
  deploy-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Kubernetes Cluster via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # 1. Purana standalone Docker container band karein (port 3000 free karne ke liye)
            sudo docker stop gmz-health-app 2>/dev/null || true
            sudo docker rm gmz-health-app 2>/dev/null || true

            # 2. Check karein agar Kubernetes (K3s) install nahi hai to install karein
            if ! command -v k3s &> /dev/null && ! command -v kubectl &> /dev/null; then
              echo "Installing lightweight certified Kubernetes (K3s)..."
              curl -sfL https://get.k3s.io | sh -
              sudo chmod 644 /etc/rancher/k3s/k3s.yaml
            fi

            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            # K3s node ko ready hone ka wait karein
            sudo kubectl wait --for=condition=Ready node --all --timeout=60s 2>/dev/null || sleep 10

            # 3. Docker Hub credentials ka secret banayein (taake ImagePull error na aaye)
            sudo kubectl create secret docker-registry dockerhub-secret \
              --docker-server=https://index.docker.io/v1/ \
              --docker-username="${{ secrets.DOCKER_USERNAME }}" \
              --docker-password="${{ secrets.DOCKER_PASSWORD }}" \
              --dry-run=client -o yaml | sudo kubectl apply -f -

            # 4. Latest code pull karein (k8s manifests ke liye)
            sudo mkdir -p /var/www/html
            sudo chown -R $USER:$USER /var/www/html
            cd /var/www/html
            if [ ! -d "/var/www/html/GMZ_Task_2/.git" ]; then
              git clone https://github.com/ZainCloud009/GMZ_Task_2.git
            else
              cd /var/www/html/GMZ_Task_2
              git pull origin main
            fi

            cd /var/www/html/GMZ_Task_2

            # 5. deployment.yaml me Docker Hub image name set karein
            sed -i "s|DOCKER_IMAGE_PLACEHOLDER|${{ secrets.DOCKER_USERNAME }}/gmz-health-app:latest|g" k8s/deployment.yaml

            # 6. Kubernetes resources apply karein
            sudo kubectl apply -f k8s/

            # 7. Nayi image ke sath rolling update karein (Timeout 180s rakha hai taake image download ho sake)
            sudo kubectl rollout restart deployment/gmz-health-app
            if ! sudo kubectl rollout status deployment/gmz-health-app --timeout=180s; then
              echo "=== Rollout timed out, showing Pod Status ==="
              sudo kubectl get pods -o wide
              sudo kubectl describe pods
              exit 1
            fi
