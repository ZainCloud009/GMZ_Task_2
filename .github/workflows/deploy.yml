name: Deploy to Server with Docker

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Docker Container to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # 1. Docker check aur install karein (Amazon Linux 2023)
            if ! command -v docker &> /dev/null; then
              if command -v dnf &> /dev/null; then
                sudo dnf install -y docker
              else
                sudo apt-get update -y && sudo apt-get install -y docker.io
              fi
              sudo systemctl start docker
              sudo systemctl enable docker
            fi

            sudo systemctl start docker

            # 2. Agar pehle se PM2 port 3000 use kar raha tha to usay free karein
            command -v pm2 &> /dev/null && pm2 delete health-app 2>/dev/null || true

            # 3. /var/www/html directory aur latest code pull karein
            sudo mkdir -p /var/www/html
            sudo chown -R $USER:$USER /var/www/html

            cd /var/www/html
            if [ ! -d "/var/www/html/GMZ_Task_2/.git" ]; then
              git clone https://github.com/ZainCloud009/GMZ_Task_2.git
            else
              cd /var/www/html/GMZ_Task_2
              git pull origin main
            fi

            # 4. Docker Image build karein
            cd /var/www/html/GMZ_Task_2
            sudo docker build -t gmz-health-app:latest .

            # 5. Purana container stop & remove kar ke naya run karein
            sudo docker stop gmz-health-app 2>/dev/null || true
            sudo docker rm gmz-health-app 2>/dev/null || true
            sudo docker run -d --name gmz-health-app --restart always -p 3000:3000 gmz-health-app:latest

            # 6. Unused images clean karein (taake disk full na ho)
            sudo docker image prune -f
