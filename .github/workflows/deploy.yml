name: Build, Push to Docker Hub and Deploy to Kubernetes

on:
  push:
    branches: [ "main" ]

jobs:
  # ==========================================
  # JOB 1: Docker Image Build & Push to Docker Hub
  # ==========================================
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/gmz-health-app:latest

  # ==========================================
  # JOB 2: Deploy to Kubernetes on AWS EC2
  # ==========================================
  deploy-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Kubernetes Cluster via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            # 1. 2GB Swap Memory ensure karein (1GB RAM crash se bachane ke liye)
            if [ ! -f /swapfile ] || [ $(stat -c%s /swapfile 2>/dev/null || echo 0) -lt 1000000000 ]; then
              echo "Setting up 2GB swap space..."
              sudo swapoff /swapfile 2>/dev/null || true
              sudo dd if=/dev/zero of=/swapfile bs=128M count=16
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              grep -q "/swapfile" /etc/fstab || echo '/swapfile swap swap defaults 0 0' | sudo tee -a /etc/fstab
            fi
            sudo swapon /swapfile 2>/dev/null || true

            # 2. Standalone Docker container stop karein (port 3000 free karne ke liye)
            sudo docker stop gmz-health-app 2>/dev/null || true
            sudo docker rm gmz-health-app 2>/dev/null || true

            # 3. Amazon Linux 2023 SELinux permission fix
            sudo setenforce 0 2>/dev/null || true

            # 4. K3s install / setup with 644 permissions and no traefik
            if ! command -v k3s &> /dev/null; then
              echo "Installing lightweight K3s..."
              curl -sfL https://get.k3s.io | sh -s - --disable=traefik --disable=servicelb --write-kubeconfig-mode 644
            fi

            # Service ensure running
            sudo systemctl restart k3s
            sudo chmod 644 /etc/rancher/k3s/k3s.yaml 2>/dev/null || true

            # Kubeconfig setup (root aur ec2-user dono ke liye)
            mkdir -p $HOME/.kube
            sudo mkdir -p /root/.kube
            sudo cp /etc/rancher/k3s/k3s.yaml $HOME/.kube/config 2>/dev/null || true
            sudo cp /etc/rancher/k3s/k3s.yaml /root/.kube/config 2>/dev/null || true
            sudo chown -R $USER:$USER $HOME/.kube 2>/dev/null || true
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            # 5. Fast curl check for Kubernetes API Server (Never hangs)
            echo "Waiting for Kubernetes API Server (/readyz)..."
            API_READY=false
            for i in {1..30}; do
              if curl -k -s --connect-timeout 2 --max-time 3 https://127.0.0.1:6443/readyz 2>/dev/null | grep -q "ok"; then
                echo "Kubernetes API Server is 100% READY!"
                API_READY=true
                break
              fi
              echo "Waiting for API server to initialize ($i/30)..."
              sleep 3
            done

            if [ "$API_READY" != "true" ]; then
              echo "=== K3s Status & Error Logs ==="
              sudo systemctl status k3s --no-pager
              sudo journalctl -u k3s -n 30 --no-pager
              exit 1
            fi

            # 6. Clean Git Pull
            sudo mkdir -p /var/www/html
            sudo chown -R $USER:$USER /var/www/html
            cd /var/www/html
            if [ ! -d "/var/www/html/GMZ_Task_2/.git" ]; then
              git clone https://github.com/ZainCloud009/GMZ_Task_2.git
            else
              cd /var/www/html/GMZ_Task_2
              git reset --hard HEAD
              git pull origin main
            fi

            cd /var/www/html/GMZ_Task_2

            # 7. Docker Hub credentials ka secret banayein
            kubectl create secret docker-registry dockerhub-secret \
              --docker-server=https://index.docker.io/v1/ \
              --docker-username="${{ secrets.DOCKER_USERNAME }}" \
              --docker-password="${{ secrets.DOCKER_PASSWORD }}" \
              --dry-run=client -o yaml | kubectl apply -f -

            # 8. deployment.yaml me Docker Hub image name set karein
            sed -i "s|DOCKER_IMAGE_PLACEHOLDER|${{ secrets.DOCKER_USERNAME }}/gmz-health-app:latest|g" k8s/deployment.yaml

            # 9. Kubernetes apply without validation timeout
            kubectl apply --validate=false -f k8s/

            # 10. Rolling update & status check
            kubectl rollout restart deployment/gmz-health-app
            if ! kubectl rollout status deployment/gmz-health-app --timeout=120s; then
              echo "=== Pods Status ==="
              kubectl get pods -o wide
              kubectl describe pods
              exit 1
            fi
