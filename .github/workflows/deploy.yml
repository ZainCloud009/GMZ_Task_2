name: Build, Push to Docker Hub and Deploy to AWS EKS (via Infisical)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: Docker Image Build & Push
  # ==========================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Fetch secrets dynamically from Infisical Secret Manager
      - name: Fetch Secrets from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: "universal"
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: "secret-management"
          env-slug: "prod"
          domain: "https://app.infisical.com"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/gmz-health-app:latest

  # ==========================================
  # JOB 2: Deploy to AWS EKS Cluster
  # ==========================================
  deploy-eks:
    name: Deploy to AWS EKS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Fetch secrets from Infisical (Docker & DB Credentials)
      - name: Fetch Secrets from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: "universal"
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: "secret-management"
          env-slug: "prod"
          domain: "https://app.infisical.com"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Update Kubeconfig for EKS
        run: |
          echo "Connecting to EKS cluster gmz-k8s-cluster in eu-north-1..."
          aws eks update-kubeconfig --region eu-north-1 --name gmz-k8s-cluster

      # Sync Database Credentials from Infisical directly into Kubernetes Secret
      - name: Sync Database Credentials from Infisical to Kubernetes Secret
        run: |
          echo "Syncing Infisical DB credentials to Kubernetes Secret gmz-db-credentials..."
          kubectl create secret generic gmz-db-credentials \
            --from-literal=DB_ENGINE="${{ env.DB_ENGINE }}" \
            --from-literal=DB_HOST="${{ env.DB_HOST }}" \
            --from-literal=DB_PORT="${{ env.DB_PORT }}" \
            --from-literal=DB_USER="${{ env.DB_USER }}" \
            --from-literal=DB_PASSWORD="${{ env.DB_PASSWORD }}" \
            --from-literal=DB_NAME="${{ env.DB_NAME }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Trigger Rolling Update on EKS
        run: |
          echo "Ensuring deployment uses latest image..."
          kubectl set image deployment/gmz-health-app health-app-container=${{ env.DOCKER_USERNAME }}/gmz-health-app:latest
          
          echo "Restarting deployment to pull the fresh image..."
          kubectl rollout restart deployment/gmz-health-app
          
          echo "Waiting for rollout to finish..."
          kubectl rollout status deployment/gmz-health-app --timeout=180s

      - name: Verify Deployment & Service
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployment gmz-health-app
          echo "=== Pods Status ==="
          kubectl get pods -o wide
          echo "=== Service Status ==="
          kubectl get svc gmz-health-service
