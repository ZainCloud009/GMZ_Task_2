name: Build, Push to Docker Hub and Deploy to AWS EKS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: Docker Image Build & Push
  # ==========================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/gmz-health-app:latest

  # ==========================================
  # JOB 2: Deploy to AWS EKS Cluster
  # ==========================================
  deploy-eks:
    name: Deploy to AWS EKS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Update Kubeconfig for EKS
        run: |
          echo "Connecting to EKS cluster gmz-k8s-cluster in eu-north-1..."
          aws eks update-kubeconfig --region eu-north-1 --name gmz-k8s-cluster

      - name: Trigger Rolling Update on EKS
        run: |
          echo "Ensuring deployment uses latest image..."
          kubectl set image deployment/gmz-health-app health-app-container=${{ secrets.DOCKER_USERNAME }}/gmz-health-app:latest
          
          echo "Restarting deployment to pull the fresh image..."
          kubectl rollout restart deployment/gmz-health-app
          
          echo "Waiting for rollout to finish..."
          kubectl rollout status deployment/gmz-health-app --timeout=180s

      - name: Verify Deployment & Service
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployment gmz-health-app
          echo "=== Pods Status ==="
          kubectl get pods -o wide
          echo "=== Service Status ==="
          kubectl get svc gmz-health-service
